# Directories offered by fzf-dir. Each line may contain glob patterns.
# A line is listed itself, and its direct subdirectories are listed too,
# so `~/work/*` reaches the projects inside every client directory without
# naming the clients here.
~
~/projects
~/projects/github.com
~/work
~/work/*
~/learn
~/personal
~/workspace
~/workspace/work
~/workspace/personal
~/workspace/github.com
~/workspace/github.com/Thazulk
~/workspace/github.com/Thazulk/lab
